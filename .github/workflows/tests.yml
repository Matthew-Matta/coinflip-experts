name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only base and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build the C++ demo backend
        run: |
          cmake -S port -B port/build
          cmake --build port/build --target moe_run --parallel 2
      - name: Run offline demo without the reference or GPU extras
        run: make demo PYTHON=python
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU Torch and project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,reference,modal]'
      - name: Require the pinned reference runtime
        run: |
          python -c "import torch, transformers; assert transformers.__version__ == '5.12.1'; print(torch.__version__)"
      - name: CPU and Torch build diagnostics
        run: |
          lscpu
          python -c "import torch; print(torch.__config__.show()); print('threads', torch.get_num_threads(), 'interop', torch.get_num_interop_threads()); print('capability', torch.backends.cpu.get_cpu_capability())"
      - name: Describe eager mirror layout portability
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m reference.ci_portability --out ci-portability
      - name: Build and test C++
        run: |
          cmake -S port -B port/build
          cmake --build port/build --parallel 2
          ctest --test-dir port/build --output-on-failure
      - name: Require real reference tests (no missing-Torch skip)
        env:
          COINFLIP_MIRROR_DIAGNOSTICS: ci-portability/test-failures
        run: python -m pytest -q reference/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-portability
          path: ci-portability
      - name: Describe Linux top-k choices on macOS bf16 tie rows
        run: python -m analysis.topk_portability --out topk-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topk-linux
          path: topk-linux.json
      - name: Full Python and blinded-pipeline tests
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
