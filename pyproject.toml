[project]
name = "coinflip-experts"
version = "0.0.1"
description = "Measuring, attributing and pricing MoE expert-route flips in production inference; routediff porting bisector"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
gpu = ["torch", "transformers", "accelerate"]
analysis = ["matplotlib", "scipy"]
dev = ["pytest"]
reference = ["torch", "transformers==5.12.1", "safetensors", "numpy", "datasets"]
modal = ["modal==1.6.1"]

[tool.setuptools.packages.find]
include = ["coinflip*", "routetrace*", "census*", "attribution*", "routediff*", "budget*", "reference*", "evaluation*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference/tests", "modal/tests", "evaluation/tests", "analysis/tests", "census/tests"]
